{% if user.is_authenticated %}
<nav>
    <a href="{% url 'index' %}">Início</a> |
    <a href="{% url 'listar_clientes' %}">Clientes</a> |
    <a href="{% url 'listar_livros' %}">Pesquisar livros</a> |
    <a href="{% url 'cadastrar_livro' %}">Cadastrar livro</a> |
    <a href="{% url 'listar_emprestimos' %}">Empréstimos</a> |
    <a href="{% url 'listar_reservas' %}">Reservas</a>
    {% if user.is_superuser %}
        | <a href="{% url 'listar_funcionarios' %}">Funcionários</a>
        | <a href="{% url 'relatorios' %}">Relatórios</a>
    {% endif %}
    <form method="post" action="{% url 'logout' %}" style="display: inline;">
        {% csrf_token %}
        <button type="submit">Sair</button>
    </form>
</nav>
<hr>
{% endif %}
