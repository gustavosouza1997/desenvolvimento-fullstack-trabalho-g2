<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ titulo }}</title>
</head>
<body>
    {% include '_menu.html' %}
    {% include '_mensagens.html' %}
    <h1>{{ titulo }}</h1>
    <form method="post" {% if tem_arquivo %}enctype="multipart/form-data"{% endif %}>
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Salvar</button>
    </form>
    <p><a href="{% url 'index' %}">Voltar</a></p>
</body>
</html>
