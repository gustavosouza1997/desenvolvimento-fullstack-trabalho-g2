<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar</title>
</head>
<body>
    <h1>Acesso de funcionários</h1>
    {% if form.errors %}<p>Usuário ou senha inválidos.</p>{% endif %}
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Entrar</button>
        <input type="hidden" name="next" value="{{ next }}">
    </form>
</body>
</html>
